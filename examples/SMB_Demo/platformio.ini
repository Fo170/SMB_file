; Exemple de build local pour la librairie SMB_file (ESP32 uniquement).
;
; Compile :  pio run
; Upload  :  pio run -t upload
; Moniteur:  pio device monitor
;
; `file://../../` installe la librairie depuis ce dépôt (utile en local).
; Dans un vrai projet, remplacez par la forme git complète :
;   lib_deps = https://github.com/Fo170/SMB_file.git@^1.2.0

[platformio]
src_dir = .
default_envs = esp32dev

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200

lib_deps =
    file://../../
