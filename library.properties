sentence=Client SMB 2.1 / NTLMv2 (ESP32) pour la gestion de fichiers sur partage reseau (NAS/Windows).
paragraph=Connexion SMB 2.1 sur TCP 445, authentification NTLMv2 (SPNEGO + HMAC-MD5) et signature SMB2 (HMAC-SHA256). Operations fichier : creation, suppression, existence, dossier, parcours de repertoire, lecture (complete/morceaux/derniere ligne/tail), ecriture, ajout, position/seek. API synchrone (bloquante) et file d'attente non bloquante avec statut. Acces multiples serialises par mutex recursif. Crypto integree (MD4, MD5, HMAC-MD5, SHA-256, HMAC-SHA256).
